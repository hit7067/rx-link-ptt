<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title">
<title id="title">Alpaca link 羊駝與手持無線電</title>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#57caff"/><stop offset=".52" stop-color="#7d8ef4"/><stop offset="1" stop-color="#c2a4ff"/></linearGradient>
 <linearGradient id="wool" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#fffdfb"/><stop offset="1" stop-color="#dce7fb"/></linearGradient>
 <linearGradient id="radio" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f9fdff"/><stop offset="1" stop-color="#b7c9eb"/></linearGradient>
 <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#123e79"/><stop offset="1" stop-color="#39caff"/></linearGradient>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#172b62" flood-opacity=".35"/></filter>
</defs>
<rect x="5" y="5" width="246" height="246" rx="52" fill="url(#bg)"/><rect x="10" y="10" width="236" height="236" rx="47" fill="none" stroke="#fff" stroke-opacity=".68" stroke-width="2"/>
<g filter="url(#shadow)">
 <!-- long alpaca neck and fluffy silhouette -->
 <path d="M64 217Q48 190 54 164Q58 141 75 126L64 87Q48 62 61 31Q65 20 75 32L99 66Q113 58 132 64L163 66 185 32Q195 20 201 34Q214 66 194 92L188 123Q207 144 211 173L207 217Z" fill="url(#wool)" stroke="#fff" stroke-width="2.5"/>
 <!-- distinct long ears -->
 <path d="M64 78Q53 52 67 33L88 72 83 91Z" fill="#fff" stroke="#e7efff" stroke-width="3"/><path d="M72 70L68 43 81 72Z" fill="#f2b9d4"/>
 <path d="M171 72L193 34Q205 59 190 83L177 94Z" fill="#fff" stroke="#e7efff" stroke-width="3"/><path d="M184 70L195 45 190 76Z" fill="#f2b9d4"/>
 <!-- fluffy forelock curls -->
 <g fill="#fff"><circle cx="89" cy="73" r="16"/><circle cx="108" cy="67" r="17"/><circle cx="126" cy="72" r="16"/><circle cx="144" cy="70" r="16"/><circle cx="161" cy="78" r="15"/><circle cx="96" cy="87" r="13"/><circle cx="116" cy="84" r="15"/><circle cx="137" cy="85" r="14"/><circle cx="155" cy="91" r="12"/></g>
 <!-- sunglasses -->
 <path d="M66 96Q91 83 118 96L115 117Q92 128 72 115Z" fill="url(#lens)" stroke="#23467c" stroke-width="5"/>
 <path d="M132 96Q159 83 185 95L178 116Q157 128 134 117Z" fill="url(#lens)" stroke="#23467c" stroke-width="5"/>
 <path d="M115 100L135 100" stroke="#23467c" stroke-width="7" stroke-linecap="round"/><path d="M77 97L102 94M143 95L168 94" stroke="#c7f4ff" stroke-width="3" stroke-linecap="round"/>
 <!-- muzzle and smile -->
 <ellipse cx="126" cy="148" rx="40" ry="35" fill="#fff"/><ellipse cx="126" cy="143" rx="9" ry="7" fill="#273b68"/>
 <path d="M126 149L126 158M126 158Q115 171 105 160M126 158Q137 171 147 160" fill="none" stroke="#273b68" stroke-width="4" stroke-linecap="round"/>
 <path d="M91 140Q80 134 76 144M160 140Q172 134 176 144" fill="none" stroke="#d5e3f8" stroke-width="5" stroke-linecap="round"/>
 <!-- clear handheld two-way radio: antenna, knob, PTT side key, speaker and keypad -->
 <g transform="rotate(13 190 180)">
  <path d="M181 137L179 116Q179 110 184 109L188 109Q192 109 192 115L192 140" fill="none" stroke="#edf6ff" stroke-width="5" stroke-linecap="round"/>
  <rect x="178" y="136" width="31" height="91" rx="8" fill="url(#radio)" stroke="#526da5" stroke-width="3"/>
  <rect x="184" y="143" width="19" height="13" rx="3" fill="#344e7f"/>
  <rect x="186" y="146" width="15" height="7" rx="2" fill="#88dfff"/>
  <rect x="175" y="163" width="5" height="20" rx="2" fill="#9bb4e1"/>
  <rect x="184" y="164" width="19" height="3" rx="1.5" fill="#7189b8"/>
  <rect x="184" y="170" width="19" height="3" rx="1.5" fill="#7189b8"/>
  <rect x="184" y="176" width="19" height="3" rx="1.5" fill="#7189b8"/>
  <g fill="#6b82b1"><circle cx="187" cy="190" r="2"/><circle cx="193" cy="190" r="2"/><circle cx="199" cy="190" r="2"/><circle cx="187" cy="197" r="2"/><circle cx="193" cy="197" r="2"/><circle cx="199" cy="197" r="2"/></g>
  <rect x="185" y="207" width="17" height="8" rx="3" fill="#7a95c7"/><circle cx="194" cy="221" r="2.5" fill="#6684b9"/>
 </g>
 <!-- radio signal arcs -->
 <path d="M201 88Q216 96 217 111M208 79Q230 91 231 113" fill="none" stroke="#e6f9ff" stroke-width="4" stroke-linecap="round"/>
</g></svg>